apiVersion: apps/v1
kind: Deployment
metadata:
  name: goshop-goods-srv
  labels:
    app.kubernetes.io/part-of: goshop
    app.kubernetes.io/name: goshop-goods-srv
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/part-of: goshop
      app.kubernetes.io/name: goshop-goods-srv
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: goshop
        app.kubernetes.io/name: goshop-goods-srv
    spec:
      containers:
        - name: goods
          image: goshop/goods:latest
          ports:
            - {name: grpc, containerPort: 9002}
            - {name: metrics, containerPort: 9052}
          envFrom:
            - secretRef: {name: goshop-goods-secrets}
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /livez, port: metrics}
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: goshop-goods-srv
  labels:
    app.kubernetes.io/part-of: goshop
    app.kubernetes.io/name: goshop-goods-srv
spec:
  selector:
    app.kubernetes.io/part-of: goshop
    app.kubernetes.io/name: goshop-goods-srv
  ports:
    - {name: grpc, port: 9002, targetPort: grpc}
    - {name: metrics, port: 9052, targetPort: metrics}
